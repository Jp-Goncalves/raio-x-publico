# Profile do dbt usado DENTRO do contêiner do Airflow. Tudo vem de variável de
# ambiente (definidas no docker-compose.yml), então não há credencial no arquivo.
raio_x_publico:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST') }}"
      port: "{{ env_var('POSTGRES_PORT') | as_number }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: public
      threads: 4
