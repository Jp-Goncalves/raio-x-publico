x-airflow-common: &airflow-common
  image: raio-x-publico-airflow:3.4.0
  build:
    context: .
    dockerfile: airflow/Dockerfile
  profiles: ["airflow"]
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # sem valor padrão de propósito: um padrão público seria uma chave que todo mundo conhece.
    # O airflow-init se recusa a subir se estiver vazia
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # desenvolvimento: enxerga DAGs novos em 30s (o padrão é 300s)
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
    # usadas pelas tarefas do projeto (src/db.py e dbt); dentro da rede do Docker
    # o banco do projeto é o serviço "postgres", na porta padrão
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}
    DBT_PROFILES_DIR: /opt/airflow/dbt_profiles
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/dbt_profiles:/opt/airflow/dbt_profiles
    - ./src:/opt/airflow/project/src
    - ./dbt:/opt/airflow/project/dbt
    - ./data:/opt/airflow/project/data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    airflow-db:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    container_name: raio-x-publico-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # só a própria máquina alcança o banco. Sem o 127.0.0.1, o Docker publica em todas as
      # interfaces e qualquer um da mesma rede chega ao Postgres
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Airflow (fase 3): suba com `docker compose --profile airflow up -d` ---

  # Banco só de metadados do Airflow, separado do banco do projeto
  airflow-db:
    image: postgres:16
    profiles: ["airflow"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        # segredos obrigatórios e fortes: melhor parar aqui do que subir com um valor que todo
        # mundo conhece (a senha "airflow" é a primeira que qualquer um tenta)
        if [ -z "$${AIRFLOW__CORE__FERNET_KEY}" ] || [ -z "$${AIRFLOW__API_AUTH__JWT_SECRET}" ] \
           || [ -z "$${_AIRFLOW_WWW_USER_PASSWORD}" ] || [ "$${_AIRFLOW_WWW_USER_PASSWORD}" = "airflow" ]; then
          echo "ERRO: preencha AIRFLOW_FERNET_KEY, AIRFLOW_JWT_SECRET e AIRFLOW_ADMIN_PASSWORD" >&2
          echo "no .env (a senha não pode ser 'airflow'). Os comandos pra gerar estão no .env.example." >&2
          exit 1
        fi
        mkdir -p /opt/airflow/logs /opt/airflow/dags
        /entrypoint airflow version
        # usuário restrito (papel User: dispara execuções, mas não mexe em conexões, variáveis
        # nem pools, que o papel Op permitiria) que o dashboard usa pra pedir cargas sob demanda.
        # "|| true": se já existir, o comando reclama e segue
        if [ -n "$${DASHBOARD_AIRFLOW_PASSWORD}" ]; then
          airflow users create --username "$${DASHBOARD_AIRFLOW_USER}" --firstname Dashboard \
            --lastname Raiox --role User --email dashboard@example.com \
            --password "$${DASHBOARD_AIRFLOW_PASSWORD}" || true
        fi
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs /opt/airflow/dags || true
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-}
      DASHBOARD_AIRFLOW_USER: ${DASHBOARD_AIRFLOW_USER:-dashboard}
      DASHBOARD_AIRFLOW_PASSWORD: ${DASHBOARD_AIRFLOW_PASSWORD:-}
    user: "0:0"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Atende operadores "deferrable". Nossos DAGs não usam, mas sem ele a saúde
  # do Airflow fica marcada como "unhealthy" na interface.
  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # --- Dashboard: suba com `docker compose --profile dashboard up -d --build` ---
  dashboard:
    image: raio-x-publico-dashboard:1
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    profiles: ["dashboard"]
    restart: unless-stopped
    environment:
      # dentro do contêiner o Streamlit precisa escutar em 0.0.0.0, senão a porta
      # publicada não alcança o app; quem restringe ao seu computador é o
      # mapeamento de portas abaixo (127.0.0.1)
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # cargas sob demanda: o dashboard pede ao Airflow (se o profile airflow estiver no ar)
      AIRFLOW_API_URL: http://airflow-apiserver:8080
      DASHBOARD_AIRFLOW_USER: ${DASHBOARD_AIRFLOW_USER:-dashboard}
      DASHBOARD_AIRFLOW_PASSWORD: ${DASHBOARD_AIRFLOW_PASSWORD:-}
    ports:
      - "127.0.0.1:8501:8501"
    # contêiner enxuto: sem privilégios extras, sem capacidades do Linux, e o sistema de arquivos
    # só de leitura (o /tmp é um disco em memória). O app só lê o banco e fala com o Airflow
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  airflow-db-volume:
